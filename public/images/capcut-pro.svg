<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="capcutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="50%" stop-color="#101318" />
      <stop offset="100%" stop-color="#030406" />
    </linearGradient>

    <radialGradient id="capcutAura" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#4facfe" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050608" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="capcutIconGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>

    <filter id="capcutShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="30" flood-color="#00f2fe" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#capcutBg)" />
  <rect width="1600" height="900" fill="url(#capcutAura)" />

  <!-- Central Capcut Pro Emblem -->
  <g transform="translate(640, 160)" filter="url(#capcutShadow)">
    <!-- Rounded Squircle -->
    <rect width="320" height="320" rx="72" fill="#000000" stroke="#00f2fe" stroke-width="2.5" stroke-opacity="0.4" />

    <!-- CapCut Scissors/Ribbon Mark -->
    <g transform="translate(60, 60)">
      <!-- Upper Polygon -->
      <polygon points="20,10 180,10 145,85 55,85" fill="#ffffff" />
      <!-- Lower Polygon -->
      <polygon points="20,190 180,190 145,115 55,115" fill="#ffffff" />
      <!-- Center intersecting cut line accents -->
      <circle cx="100" cy="100" r="14" fill="#00f2fe" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g text-anchor="middle">
    <text x="800" y="580" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="2">
      CapCut Pro
    </text>

    <text x="800" y="622" fill="#00f2fe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" letter-spacing="4">
      VIP VIDEO CREATION SUITE · MOBILE &amp; DESKTOP
    </text>

    <!-- Feature Badges -->
    <g transform="translate(420, 660)">
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="19" fill="#0c1822" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4" />
        <text x="90" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✦ 4K 60fps No Watermark</text>
      </g>

      <g transform="translate(195, 0)">
        <rect width="180" height="38" rx="19" fill="#0c1822" stroke="#4facfe" stroke-width="1.5" stroke-opacity="0.4" />
        <text x="90" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✦ AI Auto-Captions</text>
      </g>

      <g transform="translate(390, 0)">
        <rect width="180" height="38" rx="19" fill="#0c1822" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4" />
        <text x="90" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✦ Smart AI Cutout</text>
      </g>

      <g transform="translate(585, 0)">
        <rect width="180" height="38" rx="19" fill="#0c1822" stroke="#4facfe" stroke-width="1.5" stroke-opacity="0.4" />
        <text x="90" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✦ 10,000+ VIP FX</text>
      </g>
    </g>
  </g>
</svg>
