<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="runwayBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>

    <!-- Radial Glows: Magenta, Violet & Cyan -->
    <radialGradient id="runwayGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#ec4899" stop-opacity="0.14" />
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="runwayIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f5d0fe" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="40" flood-color="#a855f7" flood-opacity="0.35" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#9333ea" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#runwayBgGrad)" />
  <rect width="1600" height="900" fill="url(#runwayGlow)" />

  <!-- Studio Grid Lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="225" x2="1600" y2="225" />
    <line x1="0" y1="450" x2="1600" y2="450" />
    <line x1="0" y1="675" x2="1600" y2="675" />
    <line x1="400" y1="0" x2="400" y2="900" />
    <line x1="800" y1="0" x2="800" y2="900" />
    <line x1="1200" y1="0" x2="1200" y2="900" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="240" r="180" fill="#a855f7" opacity="0.07" filter="blur(80px)" />
  <circle cx="1320" cy="620" r="220" fill="#06b6d4" opacity="0.06" filter="blur(90px)" />

  <!-- Central Showcase Container -->
  <g transform="translate(620, 140)" filter="url(#boxShadow)">
    <!-- Base Squircle -->
    <rect width="360" height="360" rx="84" fill="url(#runwayIconGrad)" stroke="url(#borderGrad)" stroke-width="3" />

    <!-- Runway Signature Brand Icon / Symbol (Stylized Camera / Wave / Letter R) -->
    <!-- Stylized Runway 'R' & Film Aperture Path -->
    <g transform="translate(75, 75)">
      <!-- Left Stem -->
      <rect x="25" y="25" width="40" height="160" rx="14" fill="#ffffff" />
      <!-- Top Loop -->
      <path d="M 65 25 L 125 25 C 160 25, 185 50, 185 85 C 185 120, 160 145, 125 145 L 65 145 Z" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Diagonal Leg with Dynamic Flare -->
      <path d="M 115 135 L 180 185" stroke="#ffffff" stroke-width="38" stroke-linecap="round" />
      <!-- Aperture Iris Dot -->
      <circle cx="120" cy="85" r="14" fill="url(#pillGrad)" />
    </g>

    <!-- Glass Reflection Overlay -->
    <path d="M 12 120 C 60 40, 160 14, 280 14 L 330 14 C 345 14, 348 20, 348 35 L 348 70 C 210 70, 90 140, 12 240 Z" fill="#ffffff" opacity="0.05" />
  </g>

  <!-- Floating Feature Badges -->
  <!-- Left Badge: 2,250 Credits -->
  <g transform="translate(240, 290)" filter="url(#badgeShadow)">
    <rect width="300" height="66" rx="33" fill="#12131a" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="36" cy="33" r="14" fill="#9333ea" />
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">★</text>
    <text x="64" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="1">PRO MONTHLY</text>
    <text x="64" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff">2,250 Generation Credits</text>
  </g>

  <!-- Right Badge: 4K Topaz Upscaling -->
  <g transform="translate(1060, 290)" filter="url(#badgeShadow)">
    <rect width="300" height="66" rx="33" fill="#12131a" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="36" cy="33" r="14" fill="#db2777" />
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">4K</text>
    <text x="64" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f472b6" letter-spacing="1">UNLIMITED VIDEO</text>
    <text x="64" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Topaz AI 4K Upscale</text>
  </g>

  <!-- Left Bottom Badge: Gen-3 Alpha & 15 Parallel -->
  <g transform="translate(260, 410)" filter="url(#badgeShadow)">
    <rect width="280" height="58" rx="29" fill="#12131a" stroke="#3b82f6" stroke-width="1.5" opacity="0.9" />
    <circle cx="32" cy="29" r="12" fill="#2563eb" />
    <text x="32" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">⚡</text>
    <text x="56" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#93c5fd" letter-spacing="1">PARALLEL QUEUE</text>
    <text x="56" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff">15 Simultaneous Generations</text>
  </g>

  <!-- Right Bottom Badge: Voice Clone & 100GB -->
  <g transform="translate(1080, 410)" filter="url(#badgeShadow)">
    <rect width="270" height="58" rx="29" fill="#12131a" stroke="#10b981" stroke-width="1.5" opacity="0.9" />
    <circle cx="32" cy="29" r="12" fill="#059669" />
    <text x="32" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="56" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#6ee7b7" letter-spacing="1">STORAGE &amp; AUDIO</text>
    <text x="56" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Voice Clone + 100GB Cloud</text>
  </g>

  <!-- Brand Typography Header -->
  <g transform="translate(800, 580)" text-anchor="middle">
    <!-- Super Category Tag -->
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#c084fc" letter-spacing="5">
      NEXT-GEN AI CINEMA &amp; VIDEO SUITE
    </text>

    <!-- Main Title -->
    <text y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">
      RUNWAY PRO
    </text>

    <!-- Subtitle / Value Prop -->
    <text y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      For creators leveling up their craft · Gen-3 Alpha, Gen-2 &amp; Topaz 4K Upscale
    </text>

    <!-- Pill Feature Badges -->
    <g transform="translate(0, 140)">
      <g transform="translate(-320, 0)">
        <rect x="0" y="0" width="190" height="38" rx="19" fill="#181b24" stroke="#2e3547" />
        <text x="95" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">2,250 Credits/Mo</text>
      </g>
      <g transform="translate(-105, 0)">
        <rect x="0" y="0" width="210" height="38" rx="19" fill="#181b24" stroke="#2e3547" />
        <text x="105" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">15 Parallel Generations</text>
      </g>
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="190" height="38" rx="19" fill="#181b24" stroke="#2e3547" />
        <text x="95" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">Topaz 4K Unlimited</text>
      </g>
    </g>
  </g>
</svg>
