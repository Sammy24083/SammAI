<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040911" />
      <stop offset="45%" stop-color="#081420" />
      <stop offset="100%" stop-color="#02060b" />
    </linearGradient>

    <!-- Radial Emerald/Teal Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#0d8a6c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#040911" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Container Gradient -->
    <linearGradient id="logoContainerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="50%" stop-color="#0d8e6e" />
      <stop offset="100%" stop-color="#07654e" />
    </linearGradient>

    <!-- Logo Drop Shadow -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="30" flood-color="#10a37f" flood-opacity="0.4" />
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Single Segment of ChatGPT knot -->
    <path id="chatgptKnotArm" d="M1107.3 299.1c-197.999 0-373.9 127.3-435.2 315.3L650 743.5v427.9c0 21.4 11 40.4 29.4 51.4l344.5 198.515V833.3h.1v-27.9L1372.7 604c33.715-19.52 70.44-32.857 108.47-39.828L1447.6 450.3C1361 353.5 1237.1 298.5 1107.3 299.1zm0 117.5-.6.6c79.699 0 156.3 27.5 217.6 78.4-2.5 1.2-7.4 4.3-11 6.1L952.8 709.3c-18.4 10.4-29.4 30-29.4 51.4V1248l-155.1-89.4V755.8c-.1-187.099 151.601-338.9 339-339.2z" fill="#ffffff" />
  </defs>

  <!-- 1. Deep Studio Canvas -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- 2. Ambient Light Glow -->
  <rect width="1600" height="900" fill="url(#centerGlow)" />

  <!-- 3. Geometric Tech Grid Lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="180" x2="1600" y2="180" />
    <line x1="0" y1="360" x2="1600" y2="360" />
    <line x1="0" y1="540" x2="1600" y2="540" />
    <line x1="0" y1="720" x2="1600" y2="720" />
    <line x1="320" y1="0" x2="320" y2="900" />
    <line x1="640" y1="0" x2="640" y2="900" />
    <line x1="960" y1="0" x2="960" y2="900" />
    <line x1="1280" y1="0" x2="1280" y2="900" />
  </g>

  <!-- 4. Central Showcase Icon Container -->
  <g transform="translate(620, 160)" filter="url(#shadowFilter)">
    <!-- Rounded Squircle Base with border -->
    <rect width="360" height="360" rx="84" fill="url(#logoContainerGrad)" stroke="#3ee1b4" stroke-width="2.5" stroke-opacity="0.35" />

    <!-- Official OpenAI ChatGPT Knot (Scaled and Centered) -->
    <!-- Original viewBox is 2406x2406, scaled to ~270x270, offset inside 360x360 box -->
    <g transform="translate(45, 45) scale(0.1122)">
      <use xlink:href="#chatgptKnotArm" />
      <use xlink:href="#chatgptKnotArm" transform="rotate(60 1203 1203)" />
      <use xlink:href="#chatgptKnotArm" transform="rotate(120 1203 1203)" />
      <use xlink:href="#chatgptKnotArm" transform="rotate(180 1203 1203)" />
      <use xlink:href="#chatgptKnotArm" transform="rotate(240 1203 1203)" />
      <use xlink:href="#chatgptKnotArm" transform="rotate(300 1203 1203)" />
    </g>
  </g>

  <!-- 5. Brand Typography -->
  <g text-anchor="middle">
    <!-- Brand Title -->
    <text x="800" y="600" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="2">
      ChatGPT Plus
    </text>

    <!-- Subtitle / Creator -->
    <text x="800" y="642" fill="#2dd4bf" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" letter-spacing="4">
      POWERED BY OPENAI · OFFICIAL SUBSCRIPTION
    </text>

    <!-- Feature Pills -->
    <g transform="translate(430, 680)">
      <!-- Pill 1: GPT-4o -->
      <g transform="translate(0, 0)">
        <rect width="165" height="38" rx="19" fill="#0c1e28" stroke="#10a37f" stroke-width="1.5" stroke-opacity="0.4" />
        <text x="82.5" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✦ GPT-4o Omnimodal</text>
      </g>

      <!-- Pill 2: o1 Reasoning -->
      <g transform="translate(180, 0)">
        <rect width="185" height="38" rx="19" fill="#0c1e28" stroke="#10a37f" stroke-width="1.5" stroke-opacity="0.4" />
        <text x="92.5" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✦ o1 Reasoning Model</text>
      </g>

      <!-- Pill 3: Canvas Workspace -->
      <g transform="translate(380, 0)">
        <rect width="165" height="38" rx="19" fill="#0c1e28" stroke="#10a37f" stroke-width="1.5" stroke-opacity="0.4" />
        <text x="82.5" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✦ Canvas Workspace</text>
      </g>

      <!-- Pill 4: DALL·E 3 -->
      <g transform="translate(560, 0)">
        <rect width="180" height="38" rx="19" fill="#0c1e28" stroke="#10a37f" stroke-width="1.5" stroke-opacity="0.4" />
        <text x="90" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✦ DALL·E 3 &amp; Voice</text>
      </g>
    </g>
  </g>
</svg>
